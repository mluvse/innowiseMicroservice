services:
  postgres:
    image: 'postgres:16'
    container_name: postgres
    restart: always
    environment:
      - 'POSTGRES_DB=${DB_NAME}'
      - 'POSTGRES_PASSWORD=${DB_PASSWORD}'
      - 'POSTGRES_USER=${DB_USER}'
    ports:
      - '${DB_PORT}:5432'
    volumes:
      - type: bind
        source: D:/innowise/pgdata
        target: /var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: redis
    restart: always
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "6379:6379"
    volumes:
      - ./redisdata:/data

