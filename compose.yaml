services:
  app:
    build: .
    container_name: userservice
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=innowise_db
      - DB_USER=postgres        # ИЗМЕНЕНО: было admin
      - DB_PASSWORD=root        # ИЗМЕНЕНО: было secret
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - app-network

  postgres:
    image: 'postgres:16'
    container_name: postgres
    restart: always
    environment:
      - 'POSTGRES_DB=innowise_db'
      - 'POSTGRES_PASSWORD=root'
      - 'POSTGRES_USER=postgres'
    ports:
      - '5432:5432'
    volumes:
      - type: bind
        source: D:/innowise/pgdata
        target: /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d innowise_db"]  # ИЗМЕНЕНО: было admin
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  redis:
    image: redis:7
    container_name: redis
    restart: always
    command: ["redis-server"]
    ports:
      - "6379:6379"
    volumes:
      - ./redisdata:/data
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
