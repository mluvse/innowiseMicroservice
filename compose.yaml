services:
  postgres:
    image: 'postgres:16'
    container_name: innowise
    restart: always
    environment:
      - 'POSTGRES_DB=${DB_NAME}'
      - 'POSTGRES_PASSWORD=${DB_PASSWORD}'
      - 'POSTGRES_USER=${DB_USER}'
    ports:
      - '${DB_PORT}:5432'
    volumes:
      - D:/innowise/var/lib/postgresql/data