databaseChangeLog:
  - include:
      file: /src/main/resources/db/changelog/001-create-tables.yaml
  - changeSet:
      id: 001
      author: admin
      preConditions:
        - dbms:
            type: postgresql

      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: name
                  type: varchar(250)
              - column:
                  name: surname
                  type: varchar(250)
              - column:
                  name: birth_date
                  type: date
              - column:
                  name: email
                  type: varchar(250)
              - column:
                  name: active
                  type: boolean
        - createTable:
            tableName: payment_cards
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: user_id
                  type: BIGINT
              - column:
                  name: number
                  type: bigint
              - column:
                  name: holder
                  type: varchar(250)
              - column:
                  name: expiration_date
                  type: date
              - column:
                  name: active
                  type: boolean
        - addForeignKeyConstraint:
            baseTableName: payment_cards
            baseColumnNames: user_id
            constraintName: fk_user
            referencedTableName: users
            referencedColumnNames: id